[project]
name = "socialengage-api"
version = "0.1.0"
description = "SocialEngage AI FastAPI backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "httpx>=0.27.2",
    "PyJWT[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
    "feedparser>=6.0.11",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
